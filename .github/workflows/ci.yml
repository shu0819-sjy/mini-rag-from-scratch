name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  light:
    name: Light gates (no model download)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install light tooling
        run: |
          python -m pip install --upgrade pip
          # Keep CI free of sentence-transformers / model downloads.
          python -m pip install numpy ruff pytest

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Ruff lint (E/F only — keep teaching shape)
        run: |
          if [ -d tests ]; then
            ruff check --select E,F --ignore E501 main.py tests
          else
            ruff check --select E,F --ignore E501 main.py
          fi

      - name: Unit tests (when present; synthetic vectors only)
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "tests/ not present yet — syntax + ruff gates only"
          fi
